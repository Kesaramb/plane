# Installed at: /etc/nginx/conf.d/plane_pmo.conf   (http context — map must live here)
#
# Who owns "/" on pmo.gobrandfactory.com: the BrandFactory landing page, or the Plane app?

# Is the visitor logged in to Plane? (session-id cookie present)
map $http_cookie $pmo_has_session {
    default "";
    "~*(?:^|;\s*)session-id=" "1";
}

# The app must own "/" whenever it is mid-flow, not just when a session exists.
#
# Plane bounces auth failures back to "/?error_code=...", sends workspace invitations to
# "/?invitation_id=...&slug=...", and hands off deep links via "/?next_path=...". All three
# arrive with no session, so with only the cookie check they were served the static landing
# page instead: a wrong password looked like a silent redirect to a marketing page with the
# error visible only in the URL bar, and invitation links could not be accepted at all.
#
# Concatenating the four values means "nothing set at all" is the single key ":::", and
# everything else falls to default. Any one of them being present hands off to the app.
map "$pmo_has_session:$arg_error_code:$arg_invitation_id:$arg_next_path" $pmo_serve_app {
    default 1;
    ":::"   0;
}

# Back from signing in to the Claude connector or the dashboard (see
# apps/api/plane/app/views/pmo_connector.py). Plane's sign-in ends at /?next_path=<path>
# and leaves the app to navigate there in the browser, which would route /api/... as one
# of its own pages and 404 — so "/" hops it server-side. ONLY with a session cookie:
# signed out, this exact URL is the sign-in page carrying the return path, and hopping it
# would bounce the person off the form they need. (A stale cookie can still hop once; the
# resume view clears it and sends them back to sign in.)
map "$pmo_has_session:$arg_next_path" $pmo_resume_hop {
    default 0;
    "1:/api/pmo/connector/resume/" 1;
}

# The dashboard takes the shared password from machines (both MCP servers read it with
# PMO_USER/PMO_PASSWORD) and a Plane session from people. Basic auth only engages when the
# request already carries a Basic header. Otherwise it is "off", nginx never sends
# WWW-Authenticate, and a browser is never shown the popup: a refusal goes to Plane's
# sign-in instead.
map $http_authorization $pmo_dashboard_basic {
    default      off;
    "~*^Basic "  "Manager Dashboard";
}
