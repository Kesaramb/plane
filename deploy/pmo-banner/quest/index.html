<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Board</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#171922; --panel2:#1e2130; --line:#2a2e3f;
    --ink:#eef1f7; --muted:#9aa3b8;
    --xp:#5b8cff; --xp2:#8ab4ff; --gold:#f5b942; --fire:#ff7a3d; --danger:#ef5f5f; --good:#3ecf8e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1b2033 0%,var(--bg) 60%);
       color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
  .wrap{max-width:880px;margin:0 auto;padding:26px 18px 60px}
  a{color:inherit}

  /* ---- player header ---- */
  .hero{display:flex;align-items:center;gap:18px;margin-bottom:22px;flex-wrap:wrap}
  .lvl{width:70px;height:70px;border-radius:18px;flex:0 0 70px;display:grid;place-items:center;
       background:linear-gradient(160deg,#2b3350,#171b2b);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .lvl b{display:block;font-size:26px;line-height:1;color:var(--gold)}
  .lvl span{font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  .who{flex:1;min-width:220px}
  .who h1{margin:0 0 2px;font-size:20px;font-weight:650}
  .who .sub{color:var(--muted);font-size:13px}
  .bar{height:12px;border-radius:99px;background:#232838;overflow:hidden;margin-top:9px;border:1px solid var(--line)}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--xp),var(--xp2));
         transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .streak{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
          border-radius:14px;padding:10px 14px}
  .streak b{font-size:22px;color:var(--fire)}
  .streak span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

  /* ---- stat strip ---- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:11.5px;color:var(--muted)}

  /* ---- boss ---- */
  .boss{background:linear-gradient(135deg,#2a1620,#1a1420);border:1px solid #4a2530;border-radius:16px;
        padding:16px 18px;margin-bottom:22px;position:relative;overflow:hidden}
  .boss:before{content:"";position:absolute;inset:0;background:radial-gradient(400px 120px at 90% 0,rgba(239,95,95,.16),transparent)}
  .boss .tag{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--danger);font-weight:700}
  .boss h2{margin:6px 0 4px;font-size:17px;font-weight:650}
  .boss .meta{color:var(--muted);font-size:12.5px}

  /* ---- quests ---- */
  h3.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .q{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);
     border-radius:13px;padding:12px 14px;margin-bottom:9px;transition:transform .15s,border-color .15s}
  .q:hover{transform:translateX(3px);border-color:#3a4160}
  .q.today{background:var(--panel2);border-color:#39406a}
  .q .rank{width:26px;text-align:center;font-weight:700;color:var(--muted);font-size:13px;flex:0 0 26px}
  .q .body{flex:1;min-width:0}
  .q .t{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q .m{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap}
  .pill{border-radius:99px;padding:1px 8px;font-size:11px;border:1px solid var(--line)}
  .pill.urgent{color:#ff8b8b;border-color:#5a2a2a}
  .pill.high{color:#ffbf7a;border-color:#5a422a}
  .pill.late{color:var(--danger);border-color:#5a2a2a}
  .xp{color:var(--xp2);font-weight:650;font-size:12.5px;white-space:nowrap}

  /* timebox: assigned work arrives without one, so it is set here, when picked up */
  .tb{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .tb .lab{font-size:11.5px;color:var(--muted)}
  button.tbx{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;
             padding:1px 8px;font-size:11px;color:var(--muted);line-height:1.5}
  button.tbx:hover{border-color:var(--xp);color:var(--xp2)}
  button.tbx[disabled]{opacity:.4;cursor:default}
  button.box{all:unset;cursor:pointer;border:1px solid #39406a;border-radius:999px;
             padding:1px 8px;font-size:11px;color:var(--xp2);line-height:1.5}
  button.box:hover{border-color:var(--xp)}

  /* ---- the anchor: one thing, for a set time, right now ---- */
  .now{background:linear-gradient(150deg,#16233d,#131726);border:1px solid #2f4470;
       border-radius:20px;padding:26px 28px;margin-bottom:24px;position:relative;overflow:hidden}
  .now:before{content:"";position:absolute;inset:0;
              background:radial-gradient(520px 180px at 85% 0,rgba(91,140,255,.18),transparent)}
  .now .tag{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--xp2);font-weight:700}
  .now h2{margin:8px 0 4px;font-size:21px;font-weight:650;line-height:1.3}
  .now h2 a{text-decoration:none}
  .now h2 a:hover{text-decoration:underline}
  .now .meta{color:var(--muted);font-size:12.5px}
  .nowgrid{display:flex;align-items:center;gap:26px;flex-wrap:wrap;position:relative}
  .nowgrid .left{flex:1;min-width:240px}
  .clock{font-variant-numeric:tabular-nums;font-size:46px;font-weight:700;line-height:1;
         color:var(--ink);letter-spacing:-.02em}
  .clock.over{color:var(--gold)}
  .clocklab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .ring{height:6px;border-radius:99px;background:#222a40;overflow:hidden;margin-top:16px;border:1px solid var(--line)}
  .ring i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--xp),var(--xp2));
          transition:width 1s linear}
  .ring i.over{background:linear-gradient(90deg,var(--gold),var(--fire))}
  .nowacts{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;position:relative}
  /* class selectors must out-specify the reset, or `all:unset` eats their borders */
  .nowacts button{all:unset;cursor:pointer;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600}
  .nowacts button.btn-done{border:1px solid var(--good);color:var(--good)}
  .nowacts button.btn-done:hover{background:rgba(62,207,142,.14)}
  .nowacts button.btn-land{border:1px solid var(--xp);color:var(--xp2)}
  .nowacts button.btn-land:hover{background:rgba(91,140,255,.14)}
  .nowacts button.btn-stop{border:1px solid var(--line);color:var(--muted)}
  .nowacts button.btn-stop:hover{border-color:var(--danger);color:var(--danger)}

  /* size, asked for once you are already in the work and know the answer */
  .sizerow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:16px;position:relative}
  .sizerow .lab{font-size:11.5px;color:var(--muted)}

  /* while a block runs the backlog is present but quiet — nothing to decide */
  .queued{opacity:.42;pointer-events:none;filter:saturate(.6)}
  .queued .q:hover{transform:none}

  /* start a block straight from a row: one click, no menu */
  .acts{display:flex;align-items:center;gap:5px}
  button.blk{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:9px;
             padding:6px 9px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
  button.blk:hover{border-color:var(--xp);color:var(--xp2);background:rgba(91,140,255,.10)}
  button.tick{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:9px;
              padding:6px 9px;font-size:12px;color:var(--good);opacity:.7}
  button.tick:hover{opacity:1;border-color:var(--good)}
  .go{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:7px 12px;
      font-size:12.5px;font-weight:600;color:var(--good);white-space:nowrap}
  .go:hover{background:rgba(62,207,142,.12);border-color:var(--good)}
  .go[disabled]{opacity:.5;cursor:default}
  .empty{text-align:center;color:var(--muted);padding:50px 10px}
  .empty .big{font-size:44px}

  /* ---- reward toast ---- */
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(120%);
         background:linear-gradient(135deg,#1d2a44,#182036);border:1px solid var(--xp);color:var(--ink);
         padding:13px 22px;border-radius:14px;font-weight:650;box-shadow:0 14px 40px rgba(0,0,0,.5);
         opacity:0;visibility:hidden;pointer-events:none;
         transition:transform .4s cubic-bezier(.2,.9,.2,1),opacity .3s;z-index:50}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
  .lvlup{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading your quests…</div></div>
<div id="toast"></div>

<script>
"use strict";
var S = null;
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };

function api(path, opts) {
  opts = opts || {}; opts.credentials = "include";
  opts.headers = opts.headers || {"Content-Type": "application/json"};
  return fetch(path, opts);
}

function toast(html, ms) {
  var t = document.getElementById("toast");
  t.innerHTML = html; t.classList.add("show");
  clearTimeout(t._x); t._x = setTimeout(function () { t.classList.remove("show"); }, ms || 2600);
}

function load() {
  api("/api/my-backlog/").then(function (r) {
    if (r.status === 401) { location.href = "/sign-in"; return null; }
    return r.ok ? r.json() : null;
  }).then(function (d) { if (d) { S = d; render(); } });
}

// Size and block are different questions and get asked in different places, so the row
// never presents two competing sets of numbers. In the list, size is information only.
function timeboxHtml(q) {
  return q.hours ? '<span class="pill">' + fmtHours(q.hours) + '</span>' : "";
}

// The size question, asked on the focus card and only when it has no answer yet: by then
// you have the task open and can actually judge it, and it is skippable — the block runs
// regardless. It writes the project estimate, which is what the capacity view reads.
function sizeHtml(b) {
  var opts = b.timebox_options || [];
  if (b.hours || !opts.length) return "";
  var out = '<div class="sizerow"><span class="lab">how big is this, roughly?</span>';
  for (var i = 0; i < opts.length; i++) {
    out += '<button class="tbx" data-timebox="' + esc(b.issue_id) + '" data-hours="' + opts[i].hours + '">'
         + fmtHours(opts[i].hours) + '</button>';
  }
  return out + '</div>';
}

function fmtHours(h) {
  return h < 1 ? Math.round(h * 60) + "m" : (Math.round(h * 10) / 10) + "h";
}

function fmtFocus(mins) {
  if (!mins) return "0m";
  var h = Math.floor(mins / 60), m = mins % 60;
  return h ? (m ? h + "h " + m + "m" : h + "h") : m + "m";
}

function fmtClock(sec) {
  var neg = sec < 0; sec = Math.abs(sec);
  var m = Math.floor(sec / 60), s = sec % 60;
  return (neg ? "+" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

// The anchor. Deliberately the largest thing on the page: what you are on, how long
// is left, and only two ways out of it.
function nowHtml(b) {
  return '<div class="now"><div class="nowgrid">' +
    '<div class="left">' +
      '<div class="tag">◈ In focus</div>' +
      '<h2><a href="' + esc(b.url) + '">' + esc(b.title) + '</a></h2>' +
      '<div class="meta">' + esc(b.ref) + ' · ' + esc(b.project) +
        ' · ' + b.minutes + '-minute block · +' + b.reward_xp + ' XP to land it</div>' +
      '<div class="ring"><i id="ring" style="width:0%"></i></div>' +
      sizeHtml(b) +
      '<div class="nowacts">' +
        '<button class="btn-done" data-done="' + esc(b.issue_id) + '" data-xp="' + b.reward_xp + '">Done — finish the task</button>' +
        '<button class="btn-land" id="landBtn">Land the block</button>' +
        '<button class="btn-stop" id="stopBtn">Stop</button>' +
      '</div>' +
    '</div>' +
    '<div style="text-align:center">' +
      '<div class="clock" id="clock">' + fmtClock(b.remaining_seconds) + '</div>' +
      '<div class="clocklab" id="clocklab">remaining</div>' +
    '</div>' +
  '</div></div>';
}

var CLOCK = null;
function startClock(b) {
  stopClock();
  var ends = Date.now() + b.remaining_seconds * 1000;
  var total = b.minutes * 60;
  function paint() {
    var left = Math.round((ends - Date.now()) / 1000);
    var el = document.getElementById("clock"), ring = document.getElementById("ring"),
        lab = document.getElementById("clocklab");
    if (!el || !ring) { stopClock(); return; }
    el.textContent = fmtClock(left);
    var done = Math.min(100, Math.max(0, 100 * (total - left) / total));
    ring.style.width = done + "%";
    if (left <= 0) {
      el.classList.add("over"); ring.classList.add("over");
      if (lab) lab.textContent = "over — land it";
    }
  }
  paint();
  CLOCK = setInterval(paint, 1000);
}
function stopClock() { if (CLOCK) { clearInterval(CLOCK); CLOCK = null; } }

function questRow(q, i) {
  var late = q.overdue_days ? '<span class="pill late">' + q.overdue_days + 'd overdue</span>' : "";
  var pri = (q.priority === "urgent" || q.priority === "high")
    ? '<span class="pill ' + q.priority + '">' + q.priority + '</span>' : "";
  var due = (!q.overdue_days && q.due) ? '<span>due ' + esc(q.due) + '</span>' : "";
  return '<div class="q' + (i < 3 ? ' today' : '') + '">' +
    '<div class="rank">' + (i + 1) + '</div>' +
    '<div class="body"><div class="t"><a href="' + esc(q.url) + '">' + esc(q.title) + '</a></div>' +
    '<div class="m">' + pri + late + due + timeboxHtml(q) +
    '<span>' + esc(q.ref) + ' · ' + esc(q.project) + '</span></div></div>' +
    '<div class="xp">+' + q.reward_xp + ' XP</div>' +
    actionsHtml(q) +
    '</div>';
}

// One click starts a block. No menu, no modal, no second decision — the whole point
// is to be working within a second of choosing, before the urge to reorganise wins.
function actionsHtml(q) {
  var mins = (S && S.block_choices) || [30, 50, 90];
  var out = '<div class="acts">';
  for (var i = 0; i < mins.length; i++) {
    out += '<button class="blk" data-focus="' + esc(q.id) + '" data-min="' + mins[i] + '" ' +
           'title="Focus for ' + mins[i] + ' minutes">' + mins[i] + 'm</button>';
  }
  return out + '<button class="tick" data-done="' + esc(q.id) + '" data-xp="' + q.reward_xp +
         '" title="Mark done without a block">✓</button></div>';
}

function render() {
  var d = S;
  var pct = d.xp_for_next ? Math.round(100 * d.xp_into_level / d.xp_for_next) : 0;
  var html =
    '<div class="hero">' +
      '<div class="lvl"><div><b>' + d.level + '</b><span>Level</span></div></div>' +
      '<div class="who"><h1>' + esc(d.player) + '</h1>' +
        '<div class="sub">' + d.xp_into_level + ' / ' + d.xp_for_next + ' XP to level ' + (d.level + 1) + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
      '<div class="streak"><b>' + d.streak_days + '</b><span>day<br>streak</span></div>' +
    '</div>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + d.open_total + '</b><span>quests remaining</span></div>' +
      '<div class="stat"><b style="color:' + (d.overdue_total ? 'var(--danger)' : 'inherit') + '">' + d.overdue_total + '</b><span>overdue</span></div>' +
      '<div class="stat"><b style="color:var(--xp2)">' + fmtFocus(d.focus_minutes_today || 0) +
        '</b><span>focused today</span></div>' +
      '<div class="stat"><b>' + d.completed_today + '</b><span>cleared today</span></div>' +
      '<div class="stat"><b>' + d.completed_this_week + '</b><span>this week</span></div>' +
    '</div>';

  // In a block, the block *is* the page. The backlog stays visible so you can see
  // what is coming, but it is dimmed and inert: nothing to weigh up until this ends.
  if (d.active_block) {
    html += nowHtml(d.active_block);
    html += '<h3 class="sec">Up next</h3><div class="queued">' +
            d.quests.filter(function (q) { return q.id !== d.active_block.issue_id; })
                    .slice(0, 3).map(questRow).join("") + '</div>';
    document.getElementById("app").innerHTML = html;
    startClock(d.active_block);
    return;
  }
  stopClock();

  if (d.boss) {
    html += '<div class="boss"><div class="tag">⚔ Boss fight</div>' +
      '<h2><a href="' + esc(d.boss.url) + '">' + esc(d.boss.title) + '</a></h2>' +
      '<div class="meta">' + esc(d.boss.ref) + ' · ' + esc(d.boss.project) + ' · <b style="color:var(--danger)">' +
      d.boss.overdue_days + ' days overdue</b> · worth ' + d.boss.reward_xp + ' XP</div></div>';
  }

  if (!d.quests.length) {
    html += '<div class="empty"><div class="big">🎉</div><h2>Backlog clear</h2>' +
            '<p>Nothing assigned to you is open. Enjoy it.</p></div>';
  } else {
    html += '<h3 class="sec">Today\'s quests</h3>' + d.quests.slice(0, 3).map(questRow).join("");
    if (d.quests.length > 3) {
      html += '<h3 class="sec">The rest of the backlog (' + (d.quests.length - 3) + ')</h3>' +
              d.quests.slice(3, 40).map(function (q, i) { return questRow(q, i + 3); }).join("");
      if (d.quests.length > 40) html += '<div class="empty">…and ' + (d.quests.length - 40) + ' more</div>';
    }
  }
  document.getElementById("app").innerHTML = html;
}

function reload() {
  return api("/api/my-backlog/").then(function (r) { return r.json(); })
    .then(function (d) { S = d; render(); return d; });
}

// start a block
document.addEventListener("click", function (e) {
  var btn = e.target.closest("button[data-focus]");
  if (!btn) return;
  var id = btn.getAttribute("data-focus"), mins = parseInt(btn.getAttribute("data-min"), 10);
  btn.disabled = true;
  api("/api/my-backlog/" + id + "/focus/", {method: "POST", body: JSON.stringify({minutes: mins})})
    .then(function (r) { return r.ok ? r.json() : r.json().then(function (j) { throw new Error(j.error || "failed"); }); })
    .then(function () {
      toast("◈ " + mins + " minutes. One thing.");
      window.scrollTo({top: 0, behavior: "smooth"});
      return reload();
    })
    .catch(function (err) { btn.disabled = false; toast("⚠ " + esc(err.message)); });
});

// land it (ran its length) or stop it (cut short) — both are recorded
document.addEventListener("click", function (e) {
  var land = e.target.closest("#landBtn"), stop = e.target.closest("#stopBtn");
  if (!land && !stop) return;
  var outcome = land ? "landed" : "stopped";
  api("/api/my-backlog/focus/end/", {method: "POST", body: JSON.stringify({outcome: outcome})})
    .then(function (r) { return r.ok ? r.json() : r.json().then(function (j) { throw new Error(j.error || "failed"); }); })
    .then(function (res) {
      toast(land ? "◈ Block landed &nbsp;<span style='color:var(--xp2)'>+" + res.reward_xp + " XP</span>"
                 : "Block stopped.");
      return reload();
    })
    .catch(function (err) { toast("⚠ " + esc(err.message)); });
});

// set a timebox
document.addEventListener("click", function (e) {
  var btn = e.target.closest("button[data-timebox]");
  if (!btn) return;
  var id = btn.getAttribute("data-timebox"), hours = parseFloat(btn.getAttribute("data-hours"));
  var row = btn.closest(".tb");
  if (row) row.querySelectorAll("button.tbx").forEach(function (b) { b.disabled = true; });
  api("/api/my-backlog/" + id + "/timebox/", {
    method: "POST", body: JSON.stringify({hours: hours})
  }).then(function (r) {
    return r.ok ? r.json() : r.json().then(function (j) { throw new Error(j.error || "failed"); });
  }).then(function () {
    toast("⏱ Timeboxed &nbsp;<span style='color:var(--xp2)'>" + fmtHours(hours) + "</span>");
    return api("/api/my-backlog/").then(function (r) { return r.json(); });
  }).then(function (d) { S = d; render(); })
    .catch(function (err) {
      if (row) row.querySelectorAll("button.tbx").forEach(function (b) { b.disabled = false; });
      toast("⚠ " + esc(err.message));
    });
});

document.addEventListener("click", function (e) {
  var btn = e.target.closest("button[data-done]");
  if (!btn) return;
  var id = btn.getAttribute("data-done"), xp = parseInt(btn.getAttribute("data-xp"), 10);
  var beforeLevel = S.level;
  var label = btn.textContent;               // "✓" in a row, full text on the focus card
  var inBlock = !!(S.active_block && S.active_block.issue_id === id);
  btn.disabled = true; btn.textContent = "…";
  api("/api/my-backlog/" + id + "/complete/", {method: "POST", body: "{}"})
    .then(function (r) { return r.ok ? r.json() : r.json().then(function (j) { throw new Error(j.error || "failed"); }); })
    .then(function (res) {
      // finishing inside a block closes the block too, so the reward covers both
      var gained = (res && res.reward_xp) || xp;
      toast((inBlock ? "◈ Landed and done" : "⚔ Quest complete") +
            " &nbsp;<span style='color:var(--xp2)'>+" + gained + " XP</span>");
      return reload();
    })
    .then(function (d) {
      if (d.level > beforeLevel) {
        setTimeout(function () { toast("🌟 <span class='lvlup'>Level " + d.level + "!</span>", 4200); }, 1200);
      }
    })
    .catch(function (err) { btn.disabled = false; btn.textContent = label; toast("⚠ " + esc(err.message)); });
});

// follow Plane's theme if the user set one
try {
  var t = localStorage.getItem("theme");
  if (t && t.indexOf("light") !== -1) document.documentElement.setAttribute("data-theme", "light");
} catch (e) {}

load();
setInterval(load, 120000);
</script>
</body>
